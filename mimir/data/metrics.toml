# Metric registry (schema version 1). Every metric a record carries must be listed here.
# kind: measured = computed by Mimir; imported = copied from a source, not re-derived.
# definition_source: mimir = defined in the Mimir spec; vpr, norns, loki = as defined by that tool.
# citations are ids in citations.toml. For struct.* they name the works followed in spirit; the
# definitions are Mimir's own because those works were not readable (see docs/specs).

[[metric]]
key = "struct.n_comb"
description = "Combinational nodes (gates or LUTs, .names with inputs)"
unit = "nodes"
levels = ["gate", "lut"]
kind = "measured"
measurer = "struct"
definition_source = "mimir"
citations = ["hutton1996dac", "hutton1997fpga"]
validation = "Known-answer unit tests (chain, tree, diamond, ladder mesh, long edge, latch) in tests/test_hutton.py. No published value compared: the sources were not readable."

