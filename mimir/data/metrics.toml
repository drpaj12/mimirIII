# Metric registry (schema version 1). Every metric a record carries must be listed here.
# kind: measured = computed by Mimir; imported = copied from a source, not re-derived.
# definition_source: a citation id (the work whose definition the metric follows; `defined_in`
# gives the pages), "mimir" (Mimir's own definition: `struct.mimir_*` variants and bookkeeping), or
# vpr, norns, loki = as defined by that tool.
# citations are ids in citations.toml that a metric's definition or method rests on.
# `named_after` lists works a Mimir-only metric is a variant of: context, not its definition.
# Page numbers of the Hutton thesis are the printed ones (PDF page = printed page + 9).

[[metric]]
key = "struct.n_comb"
description = "Combinational nodes: .names with inputs (gates or LUTs); Hutton's n_LOG"
unit = "nodes"
levels = ["gate", "lut"]
kind = "measured"
measurer = "struct"
definition_source = "hutton1997thesis"
defined_in = "thesis p. 46 (Sec. 4.1, n = n_LOG + n_PI + n_DFF); TCAD 2002 p. 928 (Sec. II)"
citations = ["hutton1997thesis", "hutton2002tcad"]
named_after = []
validation = "Known-answer unit tests in tests/test_hutton.py (chain, tree, ladder). Compared with the published values for MCNC circuits in the spec, section 10 (LUT counts of alu4 and the Fang MASc Table 3.2 sizes of 21 circuits)."

