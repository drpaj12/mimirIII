# What each result row of `results/*.jsonl` is: the implementation, its setting, the model it computes
# and where its source is pinned. Read by `mimir import-aidigit`. Values are copied from
# docs/RESULTS.md, docs/RESULTS-LUT.md, docs/I1-TPU.md, docs/I6-NEURALUT.md, docs/I8-TREELUT.md and
# pins.toml; nothing here is measured. A design in a results file that has no entry here is refused.
# A later implementation (I2 soft CPU, I3 dataflow, I4 fixed weights, I7 binarised) adds its results
# file name to `[results] files` and one [[design]] entry per design; a re-run picks it up.

[results]
suite = "ai-digit-recognition"
files = ["rtl.jsonl", "vtr.jsonl", "lpm.jsonl", "lut-vtr.jsonl", "lut-lpm.jsonl", "bnn-vtr.jsonl", "bnn-lpm.jsonl", "fixed-vtr.jsonl", "odin-sim.jsonl", "i2-rtl.jsonl", "i2-vtr.jsonl", "i2-lpm.jsonl"]

# Tool provenance of every row of the files above (docs/RESULTS.md, header paragraph).
[tools]
odin3_build = "1.6.1 pre-release (build rel-v161pre)"
odin3_commit = "59349797"
vtr_commit = "3c9a4d23b2"
run_date_reason = "the result rows carry no run date"

# Grid layout of each architecture file named in a result row (`tools.arch`), copied from the
# `<layout><auto_layout>` of the file under $VTR_ROOT/vtr_flow/arch/timing/: perimeter `io` (one
# tile wide, EMPTY corners), `fill` clb, and one `<col>` line per hard block type (first x
# `startx`, then every `repeatx`, from y = 1). `mimir.aidigit.clb_tiles` turns it into the clb
# tile count of a grid; checked against VPR's own count in tests (spec 2026-11-10-ai-digit-grid.md).
[arch_layout."k6_frac_N10_frac_chain_mem32K_40nm.xml"]
io_ring = 1
columns = [
  { type = "mult_36", startx = 6, repeatx = 8, tile_height = 4 },
  { type = "memory", startx = 2, repeatx = 8, tile_height = 6 },
]

[[design]]
id = "i1-tpu-n8"
impl_id = "I1"
arch_name = "Functional TPU, 8 x 8 systolic array"
setting = "N=8 (64 MAC units, his program of 1,350 instructions)"
model_kind = "reference network, bit-exact"
acc_ref = "golden: numpy int8 LeNet-5 (docs/GOLDEN.md)"
design_source = "uss-tpu"
rtl_sha256_reason = "I1 RTL is read by path from the pinned checkout; the generated wrapper hash is not recorded"

