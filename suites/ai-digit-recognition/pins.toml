# Pinned external inputs of the AI digit recognition suite. Nothing listed here is stored in the
# repository: `tools/fetch_data.py` downloads or locates each file and refuses a sha256 mismatch.
# Every sha256 below was computed on this machine on 2026-11-10 from the files named in `urls`.

[[source]]
id = "uss-tpu"
what = "Gabe Litteken's Functional TPU (RTL, assembler, interpreter, prebuilt LeNet_5_TRANSMISSION.bin)"
repo = "https://github.com/littekge/USS_Tensor_Processing_Unit"
commit = "8e85de4592fc7df6fa264c06ff9ff0891536e497"
licence = "MIT (Copyright (c) 2026 Gabriel Litteken)"
licence_source = "LICENSE:1-3 of the repository at the commit"
use = "read by path (env USS_TPU, default <workspace>/external/USS_Tensor_Processing_Unit), never copied"
golden_file = "Benchmarks/LeNet_5_TRANSMISSION.bin"

