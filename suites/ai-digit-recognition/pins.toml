# I6 / I8 (tool-generated LUT networks). Read by path, never copied; the training and conversion
# run in one pip venv (docs/I6-NEURALUT.md lists the pip freeze).
[[source]]
id = "neuralut"
what = "NeuraLUT-Assemble (MNIST config datasets/mnist; library neuralut): LUT-network training and Verilog generator"
repo = "https://github.com/MartaAndronic/NeuraLUT"
commit = "650c4f4ebcd9c6e47c7229c6a0786a5b4d8696c7"
licence = "Apache-2.0 (LICENSE.txt: Copyright (c) 2021, Xilinx; source headers Apache-2.0)"
licence_source = "LICENSE.txt and setup.cfg:30 of the repository at the commit"
use = "read by path (env NEURALUT_ROOT, default <workspace>/external/NeuraLUT), pip-installed from there"

[[source]]
id = "treelut"
what = "TreeLUT: gradient-boosted trees (XGBoost) to Verilog"
repo = "https://github.com/kiabuzz/TreeLUT"
commit = "ad9e70a9ba1a74ccf8df97a3f7fcdc9137e68b21"
licence = "MIT (Copyright (c) 2024 Kia Bazargan)"
licence_source = "LICENSE:1-3 of the repository at the commit"
use = "read by path (env TREELUT_ROOT, default <workspace>/external/TreeLUT), pip-installed from there"

[[source]]
id = "brevitas"
what = "Brevitas quantisation library, tag v0.7.1 (the commit named in the NeuraLUT README, 67be9b58, is a 2020 version without ParameterScaling and does not import in models.py)"
repo = "https://github.com/Xilinx/brevitas"
tag = "v0.7.1"
commit = "32cc847fc7cd6ca4c0201fd6b7d185c1103ae088"
use = "pip install from the tag in the nnlut venv; not stored"

