archive = "loki-exp3-data.tar.xz"
verdict = "host-with-notices"
sources = ["VTR odin_ii micros (micro_*)", "Loki output"]
licence_refs = ["external/vtr-verilog-to-routing/LICENSE.md", "loki/LICENSE (MIT)"]
notes = "197 design.v, all micro_* by path. Micro files carry no per-file header (grep checked)."
basis = "controller"
drop = []

[[archive]]
archive = "loki-exp4-data.tar.xz"
verdict = "split"
sources = ["Loki r4_* synthetic corpus and twins (own generator, MIT)", "VTR micros", "VerilogEval ve_*", "VTR big designs (big/: blob_merge boundtop mk* or1200 raygentop sha spree LU8PEEng LU32PEEng stereovision0-3; bgm arm_core build.log only)"]
licence_refs = ["vtr_flow/benchmarks/verilog/or1200.v:1979 (LGPL-2.1+)", "sha.v:14-21 (opencores, permissive notice)", "mkPktMerge.v:371-378 + mkDelayWorker32B.v, mkSMAdapter4B.v (generic_fifos, permissive notice)", "diffeq2.v:19 (no-warranty disclaimer)", "VTR LICENSE.md (benchmarks keep own terms)"]
notes = "Drop: 30573 symlinks (dangling outside tree, absolute home paths), 2 .db, 2 .lock, *.sh, logs with home paths unless scrubbed. Keep big/ with notices; or1200 netlist.v/blif are LGPL-2.1 derivatives, so the LGPL text ships. spree, LU8PEEng, LU32PEEng, blob_merge, boundtop, raygentop, stereovision*, bgm carry no licence in the file: recorded as none-stated. Peter 2026-10-27: each benchmark keeps its own licence as it states it (or none-stated) and is hosted with its own notice; the source PDFs and the old snapshot are never hosted."
basis = "controller"
drop = []

