# Reviewed copy (mimir remote-data lane, 2026-10-27) of the controller's per-archive hosting verdicts.
# Not legal advice. Each benchmark keeps the licence it states; nothing is relicensed.
# verdict: host | host-with-notices | split | do-not-host. basis = "controller" (the table of
# briefs/licences-2026-10-27.toml) or "derived" (no controller entry: the verdict follows the
# designs the manifest names and their rules in data/meta/licences.toml).
# drop: extra member globs a public repack drops (fnmatch on the member path).
# Rule texts: the licence texts (data/remote/licence-texts/) that travel with a design's rule.

[rule_texts]
vtr-or1200 = ["LICENSE-VTR.md", "LGPL-2.1"]
vtr-arm_core = ["LICENSE-VTR.md", "LGPL-2.1"]
verilogeval = ["LICENSE-VERILOG-EVAL"]
loki-synthetic = ["LICENSE-LOKI-MIT"]
norns-synthetic = ["LICENSE-NORNS-MIT"]
mcnc = ["LICENSE-MIMIR-MIT"]
default = ["LICENSE-VTR.md"]

[[archive]]
archive = "loki-exp2-data.tar.xz"
verdict = "host-with-notices"
sources = ["VTR odin_ii micros (micro_*)", "VerilogEval/HDLBits (ve_Prob*)", "Loki/Wyrd tool output"]
licence_refs = ["external/vtr-verilog-to-routing/LICENSE.md", "external/verilog-eval/LICENSE (MIT, NVIDIA)", "loki/LICENSE (MIT)"]
notes = "1304 design.v + 65 blif. The ve_ part rests on HDLBits problems: the VerilogEval repository licence (MIT, NVIDIA) is recorded and the original problem source does not state a licence. Peter 2026-10-27: each benchmark keeps its own licence as it states it (or none-stated) and is hosted with its own notice; the source PDFs and the old snapshot are never hosted. Drop __pycache__, designdata.pkl (safety only)."
basis = "controller"
drop = []

