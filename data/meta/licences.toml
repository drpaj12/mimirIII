# Licence of every benchmark design in Mimir, recorded as the benchmark states it (Peter 2026-10-27:
# "keep the licenses in the meta with each of the benchmarks"). Never changed, upgraded or inferred.
# `none-stated` = the benchmark's own files and documents were read and carry no licence text; any
# distribution statement they do carry is quoted in licence_notice. Legal conclusions are never
# recorded as facts here: a scope question is written as an "Open question" in licence_notice.
# Rules apply to the design slug (fnmatch). Each slug must match exactly one rule: import-meta
# fails with the list of unmatched slugs, and a test checks the committed design list. A rule with
# conf = "missing" and licence = "" records that the licence was looked for and not found.
# conf: primary = read in the benchmark's own file or documentation. Fields written to design_meta:
# licence, licence_source (file:line or URL, no local paths), licence_notice (text that must
# travel), licence_rule (the rule id).
# VTR files cited at commit 3c9a4d23b2 of the VTR repository (vtr_flow/benchmarks/verilog/).
# `check` entries are machine-checked by tests/test_meta.py when the source is present: the text
# (comment marks and blanks normalised) must occur in the cited lines of the file. root = vtr
# ($VTR_ROOT), verilog-eval ($MIMIR_VERILOG_EVAL) or verilog-eval-fork ($MIMIR_VERILOG_EVAL_FORK).

[[rule]]
id = "vtr-or1200"
match = ["norns/or1200"]
licence = "LGPL-2.1-or-later (the file: GNU Lesser General Public License version 2.1 or, at your option, any later version)"
licence_source = "vtr_flow/benchmarks/verilog/or1200.v:1972-1983"
licence_notice = "Copyright (C) 2000 Authors and OPENCORES.ORG. \"This source file may be used and distributed without restriction provided that this copyright statement is not removed from the file and that any derivative work contains the original copyright notice and the associated disclaimer.\""
conf = "primary"
check = [
  { root = "vtr", file = "vtr_flow/benchmarks/verilog/or1200.v", lines = "1972-1983", text = "Copyright (C) 2000 Authors and OPENCORES.ORG" },
  { root = "vtr", file = "vtr_flow/benchmarks/verilog/or1200.v", lines = "1972-1983", text = "GNU Lesser General Public License as published by the Free Software Foundation; either version 2.1 of the License, or (at your option) any later version." },
]

