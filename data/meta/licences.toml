licence_notice = "Embedded block: Copyright (C) 2000-2002 Rudolf Usselmann, www.asics.ws. \"This source file may be used and distributed without restriction provided that this copyright statement is not removed from the file and that any derivative work contains the original copyright notice and the associated disclaimer.\""
conf = "primary"

[[rule]]
id = "vtr-mkDelayWorker32B"
match = ["norns/mkDelayWorker32B"]
licence = "none-stated for the file as a whole; its embedded generic_fifos block carries an opencores permissive notice"
licence_source = "vtr_flow/benchmarks/verilog/mkDelayWorker32B.v:3884-3892"
licence_notice = "Embedded block: Copyright (C) 2000-2002 Rudolf Usselmann, www.asics.ws. \"This source file may be used and distributed without restriction provided that this copyright statement is not removed from the file and that any derivative work contains the original copyright notice and the associated disclaimer.\""
conf = "primary"

[[rule]]
id = "vtr-mkSMAdapter4B"
match = ["norns/mkSMAdapter4B"]
licence = "none-stated for the file as a whole; its embedded generic_fifos block carries an opencores permissive notice"
licence_source = "vtr_flow/benchmarks/verilog/mkSMAdapter4B.v:3199-3207"
licence_notice = "Embedded block: Copyright (C) 2000-2002 Rudolf Usselmann, www.asics.ws. \"This source file may be used and distributed without restriction provided that this copyright statement is not removed from the file and that any derivative work contains the original copyright notice and the associated disclaimer.\""
conf = "primary"

[[rule]]
id = "vtr-diffeq2"
match = ["norns/diffeq2"]
licence = "none-stated (the header has a no-warranty disclaimer only)"
licence_source = "vtr_flow/benchmarks/verilog/diffeq2.v:2-27"
licence_notice = "Header: Author(s) P. Sridhar, Laboratory for Digital Design Environments, University of Cincinnati, June 1991; modified for synthesis by Jay(anta) Roy; \"Source: Written in HardwareC by Rajesh Gupta, Stanford Univ. Obtained from the Highlevel Synthesis Workshop Repository.\" Disclaimer: \"This comes with absolutely no guarantees of any kind (just stating the obvious ...)\"."
