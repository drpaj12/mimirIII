# Licence of every benchmark design in Mimir, recorded as the benchmark states it (Peter 2026-10-27:
# "keep the licenses in the meta with each of the benchmarks"). Never changed, upgraded or inferred.
# `none-stated` = the benchmark's own files and documents were read and carry no licence text; any
# distribution statement they do carry is quoted in licence_notice. Not legal advice.
# Rules apply in file order, first match wins (fnmatch on the design slug); specific rules first.
# conf: primary = read in the benchmark's own file or documentation. Fields written to design_meta:
# licence, licence_source (file:line or URL, no local paths), licence_notice (text that must travel).
# Checked 2026-10-27 against the controller's per-archive check and the files each rule cites.
# VTR files cited at commit 3c9a4d23b2 of the VTR repository (vtr_flow/benchmarks/verilog/).

[[rule]]
id = "vtr-or1200"
match = ["norns/or1200"]
licence = "LGPL-2.1-or-later (the file: GNU Lesser General Public License version 2.1 or, at your option, any later version)"
licence_source = "vtr_flow/benchmarks/verilog/or1200.v:1972-1982"
licence_notice = "Copyright (C) 2000 Authors and OPENCORES.ORG. \"This source file may be used and distributed without restriction provided that this copyright statement is not removed from the file and that any derivative work contains the original copyright notice and the associated disclaimer.\" Derived netlists (BLIF, netlist.json) of this file are derivatives."
conf = "primary"

[[rule]]
id = "vtr-sha"
match = ["norns/sha"]
licence = "opencores permissive notice: may be used and distributed without restriction provided the copyright statement is not removed"
licence_source = "vtr_flow/benchmarks/verilog/sha.v:14-21"
licence_notice = "Copyright (C) 2002-2004 marsgod, marsgod@opencores.org. \"This source file may be used and distributed without restriction provided that this copyright statement is not removed from the file and that any derivative work contains the original copyright notice and the associated disclaimer.\""
conf = "primary"

[[rule]]
id = "vtr-mkPktMerge"
match = ["norns/mkPktMerge"]
