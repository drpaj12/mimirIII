[[rule]]
id = "vtr-blob_merge"
match = ["norns/blob_merge"]
licence = "none-stated"
licence_source = "vtr_flow/benchmarks/verilog/blob_merge.v:1-3; VTR LICENSE.md:56-58"
licence_notice = "File header: \"author: Alexander Bochem\", \"date: 07.05.2010\". VTR LICENSE.md: \"The benchmark circuits are all open source but each have their own individual terms and conditions which are listed in the source code of each benchmark.\""
conf = "primary"

[[rule]]
id = "vtr-stereovision"
match = ["norns/stereovision*"]
licence = "none-stated"
licence_source = "vtr_flow/benchmarks/verilog/stereovision0.v:1-6; VTR LICENSE.md:56-58"
licence_notice = "stereovision0 header: \"Ahmad Darabiha\", \"last updated Aug, 2002\". VTR LICENSE.md: \"The benchmark circuits are all open source but each have their own individual terms and conditions which are listed in the source code of each benchmark.\""
conf = "primary"

[[rule]]
id = "vtr-other-verilog"
match = ["norns/boundtop", "norns/raygentop", "norns/ch_intrinsics", "norns/diffeq1"]
licence = "none-stated"
licence_source = "vtr_flow/benchmarks/verilog/ (the file has no licence or copyright text); VTR LICENSE.md:56-58"
licence_notice = "VTR LICENSE.md: \"The benchmark circuits are all open source but each have their own individual terms and conditions which are listed in the source code of each benchmark.\""
conf = "primary"

[[rule]]
id = "vtr-micro"
match = ["loki/*/micro_*"]
licence = "none-stated in the micro files; whether VTR LICENSE.md counts them as benchmark circuits is not stated"
licence_source = "odin_ii/regression_test/benchmark/verilog/micro (336 files, none carries licence or copyright text); VTR LICENSE.md:7-8,56-58"
licence_notice = "VTR LICENSE.md: all VTR software, documents and scripts follow the MIT licence \"Unless otherwise noted (in particular ABC, the benchmark circuits and some libraries)\"; \"The benchmark circuits are all open source but each have their own individual terms and conditions which are listed in the source code of each benchmark.\" MIT notice: Copyright 2012 VTR Developers."
conf = "primary"

[[rule]]
id = "verilogeval"
match = ["loki/*/ve_*"]
licence = "MIT (VerilogEval LICENSE, Copyright (c) 2023-2024 NVIDIA Research Projects)"
licence_source = "verilog-eval LICENSE:1-3; loki NOTICE:1-3"
licence_notice = "Keep the MIT copyright and permission notice. Problems rest on HDLBits material whose own terms are not stated in the VerilogEval licence (controller check, Peter decision 1); Loki NOTICE: \"Each fetched design keeps its own licence\"."
conf = "primary"

[[rule]]
id = "loki-synthetic"
match = ["loki/*/r4_*", "loki/*/r4t_*"]
licence = "MIT (Loki LICENSE, Copyright (c) 2026 drpaj12)"
licence_source = "loki LICENSE:1-3"
licence_notice = "Keep the MIT copyright and permission notice."
conf = "primary"

[[rule]]
id = "norns-synthetic"
match = ["norns/n5_*", "norns/r5_*", "norns/r6_*", "norns/r7_*"]
licence = "MIT (Norns LICENSE, Copyright (c) 2026 drpaj12)"
licence_source = "norns LICENSE:1-3"
licence_notice = "Keep the MIT copyright and permission notice. VPR outputs on these designs fall under the VTR MIT licence (VTR LICENSE.md)."
conf = "primary"

[[rule]]
id = "mcnc"
match = ["mcnc20/*"]
licence = "none-stated"
licence_source = "MCNC LGSynth guide v3.0 (Yang 1991) p.1 and p.4; CBL page benchmarks/access.html (web.archive.org snapshot 2002-09-03); LGSynth91.readme; circuit files read, no licence text"
licence_notice = "Distribution statements (not a licence): guide p.4 \"You are free to copy and distribute material further to your colleagues as long as you don't charge for these services.\"; guide p.1 \"Its distribution is limited to peer communication and to participants of the workshop.\" and \"This report contains material previously published and distributed by the University of California (Copyright 1979, 1980, 1983, 1986 Regents of the University of California)\"; CBL access policy \"Users may copy and distribute the benchmarks as long as they do not charge for these services. These are NOT 'MCNC benchmarks'.\" Cite as the guide and CBL name them (LGSynth89, LGSynth91, LGSynth93)."
conf = "primary"
