# Flows that produced the registered netlists. `layout` and `record` are templates (`{d}` = design)
# relative to the tree an import reads; `build` is the command `mimir bench build` runs (tokens
# {odin3} {src} {out} {arch} {design} {top_args}). "not-recorded" = the data did not say.

[[flow]]
id = "odin3-1.2.0-k6-verilog"
tool = "odin3"
tool_version = "1.2.0 (ABI 7)"
tool_commit = "b01a803473164fa730a44152f153d06cd9fd7d08"
binary_sha256 = "c6e36bc736da083e893962332351b2c428d8aab6903c36fafecb953443d49667"
input = "verilog"
arch = "k6_frac_N10_frac_chain_mem32K_40nm"
lut_k = 6
script = "odin3 --top <top> -p 'read_arch <vtr>/vtr_flow/arch/timing/k6_frac_N10_frac_chain_mem32K_40nm.xml; read_verilog --nolatches --vtr-compat --prov-ast refs <vtr>/vtr_flow/benchmarks/verilog/<d>.v; proc; fsm; opt; flatten; opt -full; wreduce; hardmap; lower; abc --lut 6; stats; write_blif --vtr --lut-k 6 --name-style hash --prov-map <out>/<d>.blif'"
source = "odin-meta.json beside each netlist (Norns keep sweep, netlists/base); identical argv for all 15"
layout = "netlists/base/{d}/netlist/{d}.blif"
record = "netlists/base/{d}/netlist/odin-meta.json"
build = "{odin3} {top_args} -p \"read_arch {arch}; read_verilog --nolatches --vtr-compat --prov-ast refs {src}; proc; fsm; opt; flatten; opt -full; wreduce; hardmap; lower; abc --lut 6; stats; write_blif --vtr --lut-k 6 --name-style hash --prov-map {out}/{design}.blif\""

[[flow]]
id = "odin3-1.2.0-k6-blif"
tool = "odin3"
tool_version = "1.2.0 (ABI 7)"
tool_commit = "b01a803473164fa730a44152f153d06cd9fd7d08"
binary_sha256 = "c6e36bc736da083e893962332351b2c428d8aab6903c36fafecb953443d49667"
input = "blif"
arch = "k6_frac_N10_frac_chain_mem32K_40nm"
lut_k = 6
script = "odin3 -p 'read_arch <vtr>/vtr_flow/arch/timing/k6_frac_N10_frac_chain_mem32K_40nm.xml; read_blif <vtr>/vtr_flow/benchmarks/blif/<d>.blif; abc --lut 6; stats; write_blif --vtr --lut-k 6 <out>/<d>.blif'"
source = "odin-meta.json beside each netlist (Norns keep sweep, netlists/base); identical argv for all 20"
layout = "netlists/base/{d}/netlist/{d}.blif"
record = "netlists/base/{d}/netlist/odin-meta.json"
build = "{odin3} -p \"read_arch {arch}; read_blif {src}; abc --lut 6; stats; write_blif --vtr --lut-k 6 {out}/{design}.blif\""

[[flow]]
id = "odin3-1.1.0-k6-names"
tool = "odin3"
tool_version = "1.1.0"
tool_commit = "not-recorded"
binary_sha256 = "not-recorded"
input = "verilog"
arch = "k6_frac_N10_frac_chain_mem32K_40nm"
lut_k = 6
script = "not-recorded"
source = "header line of each netlist: Odin III 1.1.0 write_blif --vtr (K=6, names provenance); the directory holds no run record"
layout = "runs/{d}/netlist/{d}.blif"
note = "the Norns rounds 1-4 era netlists of the 15 VTR Verilog designs (mimir-sources/norns)"

[[flow]]
id = "loki-f1-k6"
tool = "loki"
tool_version = "not-recorded"
tool_commit = "not-recorded"
binary_sha256 = "not-recorded"
input = "blif"
arch = "none"
lut_k = 6
script = "loki.re.main <blif> --floor f1-k6 (the netlist it wrote)"
source = "mimir/structdet.py loki_argv; work/mimir-data/msd/run.sh; the Odin III version behind the floor is not recorded in the netlist"
layout = "work/{d}/f1-k6/netlist.blif"
note = "the four MCNC circuits of the mcnc-detect re-run (alu4, misex3, s298, seq)"

