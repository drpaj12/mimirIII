note = "set mcnc-k4 of mimir/sets.py; index only, no netlist blobs until the licence is read"

[[suite]]
id = "itc99"
title = "ITC'99 (RTL Verilog, b01-b22 without b16)"
format = "verilog"
upstream = "https://github.com/ccsl-uaegean/ITC99-RTL-Verilog"
commit = "8e6a23da036b7442ef4ea410c679d4cf21830a65"
external = "ITC99-clone"
subdir = "."
glob = "b*.v"
licence = "GPL-3.0 (the LICENSE file of this repository); the terms of the original ITC'99 distribution were not read"
licence_source = "LICENSE:1-2"
hosting = "public"
obtained = "git clone of the repository, read in place under external/ (a plain copy without .git sits in external/ITC99-RTL-Verilog)"
note = "no netlist compiled yet; a netlist derived from these files carries the GPL-3.0"

[[suite]]
id = "verilogeval"
title = "VerilogEval problems (reference solutions of the spec-to-rtl dataset) with the Gate-Breaker Yosys netlists"
format = "verilog"
upstream = "https://github.com/NMSU-PEARL/verilog-eval.git"
commit = "d60f0b10458746e2fefc2a98fa2455b77a32e8be"
external = "Gate-Breaker-verilog-eval"
subdir = "dataset_spec-to-rtl"
glob = "*_ref.sv"
strip_suffix = "_ref"
licence = "MIT (Copyright (c) 2023-2024 NVIDIA Research Projects)"
licence_source = "LICENSE:1-3"
hosting = "public"
obtained = "git clone of the Gate-Breaker fork of verilog-eval, read in place under external/"
default_flow = "yosys-0.51-vereval"
note = "the fork adds dataset_netlist-to-rtl; Gate-Breaker (github.com/NMSU-PEARL/Gate-Breaker, 8d0d3fa, BSD-3-Clause) documents the workflow and holds results, not benchmarks"

[[suite]]
id = "brisc-v"
title = "BRISC-V microcontroller (Arduino-on-RISC-V, Quartus project revert_timer)"
format = "verilog-project"
upstream = "https://github.com/qiany21/Arduino-on-RISC-V.git"
commit = "1d5b591081511a8161b843d003ca7b80bad7fc45"
external = "Arduino-on-RISC-V"
subdir = "quartus_project_revert_timer"
glob = "*.v"
top = "single_cycle_BRAM_top"
licence = "MIT (Copyright (c) 2021 qiany21)"
licence_source = "LICENSE:1-3"
hosting = "public"
obtained = "git clone, read in place under external/"
note = "top from TOP_LEVEL_ENTITY of single_cycle_BRAM_top.qsf; the 32 .v files are the design, .bak and .vmh files are not"
