# Benchmark suites Mimir registers by reference (spec: docs/specs/2026-10-31-benchmarks-design.md).
# Sources are never copied into this repository: `external` is a directory under $MIMIR_EXTERNAL
# (default <workspace>/external), `commit` the checkout that was read. Licences are recorded as the
# upstream states them (never inferred); a design with its own licence says so in designs.tsv
# (`licence_rule`, see data/meta/licences.toml). hosting: public | local-only | unchecked.

[[suite]]
id = "vtr-verilog"
title = "VTR Verilog benchmarks (top-level files of vtr_flow/benchmarks/verilog)"
format = "verilog"
upstream = "https://github.com/verilog-to-routing/vtr-verilog-to-routing"
commit = "3c9a4d23b27d187bd67c79dc01a18ff1ffc21d9b"
external = "vtr-verilog-to-routing"
subdir = "vtr_flow/benchmarks/verilog"
glob = "*.v"
slug_prefix = "norns/"
licence = "per design, as each file states (see licence_rule in designs.tsv and data/meta/licences.toml); VTR LICENSE.md: MIT unless otherwise noted, in particular the benchmark circuits"
licence_source = "LICENSE.md:1-4; per-design sources in data/meta/licences.toml"
hosting = "public"
obtained = "git checkout of the VTR repository at the commit, read in place under external/"
default_flow = "odin3-1.2.0-k6-verilog"
note = "koios and koios_proxy subdirectories are not registered yet"

[[suite]]
id = "mcnc20"
title = "MCNC / LGSynth91 circuits as VTR ships them (4-LUT mapped BLIF, circuits.txt)"
format = "blif"
upstream = "https://github.com/verilog-to-routing/vtr-verilog-to-routing"
commit = "3c9a4d23b27d187bd67c79dc01a18ff1ffc21d9b"
external = "vtr-verilog-to-routing"
subdir = "vtr_flow/benchmarks/blif"
list = "circuits.txt"
slug_prefix = "mcnc20/"
licence = "none-stated (data/meta/licences.toml rule mcnc); VTR LICENSE.md: MIT unless otherwise noted, in particular the benchmark circuits"
licence_source = "data/meta/licences.toml:mcnc; LICENSE.md:1-4"
hosting = "public"
obtained = "git checkout of the VTR repository at the commit, read in place under external/"
default_flow = "odin3-1.2.0-k6-blif"
note = "design meta (lineage, original files) is in data/meta/mcnc.toml"

[[suite]]
id = "vtr-blif-k2"
title = "VTR blif/2: ISCAS-85, ISCAS-89 and MCNC mapped to 2-input LUTs"
format = "blif"
upstream = "https://github.com/verilog-to-routing/vtr-verilog-to-routing"
commit = "3c9a4d23b27d187bd67c79dc01a18ff1ffc21d9b"
external = "vtr-verilog-to-routing"
subdir = "vtr_flow/benchmarks/blif/2"
glob = "*.blif"
licence = "not read: the licence of the individual ISCAS/MCNC files has not been checked"
licence_source = "none"
hosting = "unchecked"
obtained = "git checkout of the VTR repository at the commit, read in place under external/"
note = "set mcnc-k2 of mimir/sets.py; index only, no netlist blobs until the licence is read"

