name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**.md"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PRs: 3.12 only; push to main: full matrix.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff mypy
      # These library pins duplicate pyproject.toml's [project.optional-dependencies]; keep the two
      # files in step when either changes.
      - run: pip install "pymetis>=2025.2" "pyarrow>=15" "numpy>=1.26"
      - run: ruff check .
      - run: mypy --strict mimir tests

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PRs: 3.12 only; push to main: full matrix.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.11","3.12"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "pymetis>=2025.2" "pyarrow>=15" "numpy>=1.26"
      - run: pip install --no-deps .
      - run: python -m unittest discover -s tests -t . -v
